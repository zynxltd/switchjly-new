<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" role="img" aria-labelledby="faqChatTitle">
  <title id="faqChatTitle">How does Switchly work? We compare. You save.</title>

  <!-- Dot grid -->
  <g fill="#d0d0d0">
    <g id="dots">
      <circle cx="36" cy="28" r="2.4"/><circle cx="36" cy="48" r="2.4"/><circle cx="36" cy="68" r="2.4"/>
      <circle cx="36" cy="88" r="2.4"/><circle cx="36" cy="108" r="2.4"/><circle cx="36" cy="128" r="2.4"/>
    </g>
    <use href="#dots" x="20"/><use href="#dots" x="40"/><use href="#dots" x="60"/>
    <use href="#dots" x="80"/><use href="#dots" x="100"/>
  </g>

  <!-- Soft panel -->
  <rect x="48" y="56" width="520" height="400" rx="32" fill="#f3f3f3"/>

  <!-- Accent ticks -->
  <g stroke="#111111" stroke-width="3" stroke-linecap="round">
    <line x1="42" y1="150" x2="18" y2="162"/>
    <line x1="38" y1="178" x2="10" y2="178"/>
    <line x1="42" y1="206" x2="18" y2="194"/>
  </g>

  <!-- Question bubble -->
  <rect x="28" y="110" width="340" height="78" rx="24" fill="#111111"/>
  <path d="M78 188c2 16 14 28 34 34L92 188H78Z" fill="#111111"/>
  <text x="198" y="157" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600">How does Switchly work?</text>

  <!-- Answer bubble -->
  <rect x="220" y="220" width="360" height="82" rx="24" fill="#a3ea00"/>
  <path d="M520 302c-2 16-14 28-34 34L506 302H520Z" fill="#a3ea00"/>
  <text x="400" y="270" text-anchor="middle" fill="#111111" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">We compare. You save.</text>

  <!-- Typing -->
  <rect x="200" y="350" width="96" height="48" rx="24" fill="#111111"/>
  <path d="M268 398c-1 10-8 18-20 22L260 398H268Z" fill="#111111"/>
  <circle cx="224" cy="374" r="4.5" fill="#ffffff"/>
  <circle cx="248" cy="374" r="4.5" fill="#ffffff"/>
  <circle cx="272" cy="374" r="4.5" fill="#ffffff"/>
